[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypanelsim"
version = "0.1.0"
description = "Composable, estimator-neutral simulation infrastructure for synthetic panel data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
docs = [
    "crabbymetrics",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "pyfixest>=0.50.1",
]

[project.urls]
Documentation = "https://apoorvalal.github.io/pypanelsim"
Repository = "https://github.com/apoorvalal/pypanelsim"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pypanelsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.uv.sources]
crabbymetrics = { git = "ssh://git@github.com/apoorvalal/crabbymetrics.git" }

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
