project:
  type: website
  output-dir: ../docs
  resources:
    - .nojekyll
    - llms.txt
  render:
    - index.qmd
    - getting-started.qmd
    - architecture.md
    - assignment.qmd
    - canonical-designs.qmd
    - research-designs.qmd
    - interoperability.qmd
    - vignettes/semi-synthetic-panels.qmd
    - vignettes/baker-twfe.qmd
    - vignettes/ftest-heterogeneity.qmd
    - vignettes/support-aware-event-studies.qmd
    - vignettes/conditional-trends.qmd
    - vignettes/large-panels.qmd
    - vignettes/composite-panels.qmd
    - vignettes/balancing-reproduction.qmd
    - api.qmd
    - reference/core.qmd
    - reference/primitives.qmd
    - reference/designs.qmd
    - reference/registry.qmd
    - validation.md

website:
  title: "pypanelsim"
  description: "Composable synthetic panel data with explicit assignment and causal truth."
  site-url: "https://apoorvalal.github.io/pypanelsim"
  repo-url: "https://github.com/apoorvalal/pypanelsim"
  repo-subdir: website
  repo-actions: [edit, issue]
  search: true
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: getting-started.qmd
        text: Get started
      - href: canonical-designs.qmd
        text: Design catalog
      - href: research-designs.qmd
        text: Research designs
      - href: interoperability.qmd
        text: Export
      - href: api.qmd
        text: API
      - href: llms.txt
        text: LLM guide
    right:
      - icon: github
        href: "https://github.com/apoorvalal/pypanelsim"
        aria-label: GitHub repository
  sidebar:
    style: docked
    contents:
      - section: "Start here"
        contents:
          - index.qmd
          - getting-started.qmd
          - architecture.md
      - section: "Build a design"
        contents:
          - assignment.qmd
          - canonical-designs.qmd
          - research-designs.qmd
          - interoperability.qmd
      - section: "Research tutorials"
        contents:
          - vignettes/semi-synthetic-panels.qmd
          - vignettes/baker-twfe.qmd
          - vignettes/ftest-heterogeneity.qmd
          - vignettes/support-aware-event-studies.qmd
          - vignettes/conditional-trends.qmd
          - vignettes/large-panels.qmd
          - vignettes/composite-panels.qmd
          - vignettes/balancing-reproduction.qmd
      - section: "API reference"
        contents:
          - api.qmd
          - reference/core.qmd
          - reference/primitives.qmd
          - reference/designs.qmd
          - reference/registry.qmd
      - section: "Validation"
        contents:
          - validation.md

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    page-layout: full
    embed-resources: true
    number-sections: true
    code-copy: true
    code-fold: false
    code-overflow: wrap
    anchor-sections: true
    fig-responsive: true

execute:
  freeze: auto
  warning: false
  message: false

jupyter: python3
